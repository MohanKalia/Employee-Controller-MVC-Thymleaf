<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

<div class="container">

    <h3>Employee Directory</h3>
    <hr>

    <p class="h4 mb-4">Save Employee</p>

    <form action="#" th:action="@{/employees/save}"
          th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" th:field="*{firstName}"
               class="form-control mb-2" placeholder="First Name">
        <div th:if="${#fields.hasErrors('firstName')}"
             th:errors="*{firstName}" class="text-danger mb-3"></div>
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" th:field="*{lastName}"
               class="form-control mb-2" placeholder="Last Name">
        <div th:if="${#fields.hasErrors('lastName')}"
             th:errors="*{lastName}" class="text-danger mb-3"></div>
        <label for="email" class="form-label">Email</label>
        <input type="email" th:field="*{email}"
               class="form-control mb-2" placeholder="Email">
        <div th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}" class="text-danger mb-3"></div>

        <button type="submit" class="btn btn-info">Save</button>

    </form>
    <hr>
    <a th:href="@{/employees/list}">Back to Employees List</a>

</div>


</body>
</html>
