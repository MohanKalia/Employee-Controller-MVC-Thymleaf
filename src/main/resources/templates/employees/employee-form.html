<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>

<div class="container">

    <h1 class="h3">Employee Directory</h1>
    <hr>

    <h2 class="h4 mb-4" th:text="${employeeId == null ? 'Add employee' : 'Edit employee'}">Add employee</h2>

    <form action="#" th:action="@{/employees/save}"
          th:object="${employee}" method="post">
        <input th:if="${employeeId != null}" type="hidden" name="employeeId" th:value="${employeeId}">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" th:field="*{firstName}"
               class="form-control mb-2" maxlength="45" required placeholder="First Name">
        <div th:if="${#fields.hasErrors('firstName')}"
             role="alert" th:errors="*{firstName}" class="text-danger mb-3"></div>
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" th:field="*{lastName}"
               class="form-control mb-2" maxlength="45" required placeholder="Last Name">
        <div th:if="${#fields.hasErrors('lastName')}"
             role="alert" th:errors="*{lastName}" class="text-danger mb-3"></div>
        <label for="email" class="form-label">Email</label>
        <input type="email" th:field="*{email}"
               class="form-control mb-2" maxlength="45" required placeholder="Email">
        <div th:if="${#fields.hasErrors('email')}"
             role="alert" th:errors="*{email}" class="text-danger mb-3"></div>

        <button type="submit" class="btn btn-info">Save</button>

    </form>
    <hr>
    <a th:href="@{/employees/list}">Back to Employees List</a>

</div>


</body>
</html>
