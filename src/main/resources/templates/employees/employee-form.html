<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="pageTitle=${employeeId == null ? 'Add employee' : 'Edit employee'}">
<head th:replace="~{fragments/directory :: head(${pageTitle})}"><title>Employee details</title></head>
<body>
<div class="layout">
    <div th:replace="~{fragments/directory :: sidebar(false)}"></div>
    <div class="workspace">
        <div th:replace="~{fragments/directory :: topbar}"></div>
        <main class="content narrow-content" id="main-content" tabindex="-1">
            <a class="back-link" th:href="@{/employees/list}">Back to employees</a>
            <header class="page-heading">
                <div>
                    <h1 th:text="${pageTitle}">Add employee</h1>
                    <p th:text="${employeeId == null ? 'Enter the contact details for a new employee.' : 'Update this employee’s contact details.'}">Enter the contact details for a new employee.</p>
                </div>
            </header>

            <form class="panel editor" th:action="@{/employees/save}" th:object="${employee}" method="post"
                  aria-labelledby="details-title">
                <input th:if="${employeeId != null}" type="hidden" name="employeeId" th:value="${employeeId}">
                <div class="editor-body">
                    <div class="editor-heading">
                        <h2 id="details-title">Contact details</h2>
                        <p>All fields are required.</p>
                    </div>
                    <p class="form-alert" role="alert" th:if="${#fields.hasAnyErrors()}">Check the highlighted fields and save again.</p>
                    <div class="name-fields">
                        <div class="field">
                            <label for="firstName">First name</label>
                            <input type="text" th:field="*{firstName}" autocomplete="given-name" maxlength="45" required
                                   th:attr="aria-invalid=${#fields.hasErrors('firstName') ? 'true' : null},
                                            aria-describedby=${#fields.hasErrors('firstName') ? 'firstName-error' : null}">
                            <p class="field-error" id="firstName-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                        </div>
                        <div class="field">
                            <label for="lastName">Last name</label>
                            <input type="text" th:field="*{lastName}" autocomplete="family-name" maxlength="45" required
                                   th:attr="aria-invalid=${#fields.hasErrors('lastName') ? 'true' : null},
                                            aria-describedby=${#fields.hasErrors('lastName') ? 'lastName-error' : null}">
                            <p class="field-error" id="lastName-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                        </div>
                    </div>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input type="email" th:field="*{email}" autocomplete="email" maxlength="45" required
                               th:attr="aria-invalid=${#fields.hasErrors('email') ? 'true' : null},
                                        aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}">
                        <p class="field-error" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>
                </div>
                <div class="editor-actions">
                    <a class="button button-secondary" th:href="@{/employees/list}">Cancel</a>
                    <button class="button button-primary" type="submit"
                            th:text="${employeeId == null ? 'Add employee' : 'Save changes'}">Add employee</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
