<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

<!-- adding a button -->

<!-- The employee table starts here -->
<div class="container">
    <h3>Employee Directory</h3>
    <hr>
    <table class="table table-bordered table-striped" th:if="${!employees.isEmpty()}">
        <thead class="table-dark">
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Action</th>
        </thead>

        <tbody>
        <tr th:each="i: ${employees}">
            <td th:text="${i.firstName}"></td>
            <td th:text="${i.lastName}"></td>
            <td th:text="${i.email}"></td>
            <td>
                <a th:href="@{/employees/showFormForUpdate(employeeId=${i.id})}"
                   class="btn btn-primary btn-sm">
                    Update
                </a>
                <form th:action="@{/employees/delete(employeeId=${i.id})}" method="post"
                      style="display:inline"
                      onsubmit="return confirm('Are you sure you want to delete this employee?')">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>

    </table>
    <p th:if="${employees.isEmpty()}" class="alert alert-info">
        No employees found. Add an employee to get started.
    </p>
    <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary btn-sm mb-3">Add employee</a>
</div>
</body>
</html>
